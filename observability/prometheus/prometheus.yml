global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth
    static_configs:
      - targets: ["auth:8000"]
  - job_name: training-api
    static_configs:
      - targets: ["training-api:8000"]
  - job_name: training-worker
    static_configs:
      - targets: ["training-worker:8001"]
  - job_name: inference
    static_configs:
      - targets: ["inference:8000"]
